services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookforge
      POSTGRES_PASSWORD: bookforge
      POSTGRES_DB: bookforge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ../../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://bookforge:bookforge@postgres:5432/bookforge
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
    volumes:
      - ../../backend/output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file:
      - ../../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://bookforge:bookforge@postgres:5432/bookforge
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: local
    volumes:
      - ../../backend/output:/app/output
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # RQ Dashboard — internal only, not exposed to the internet
  # Visit http://localhost:9181 to monitor queues and jobs
  rq-dashboard:
    image: eoranged/rq-dashboard:latest
    restart: unless-stopped
    ports:
      - "9181:9181"
    environment:
      RQ_DASHBOARD_REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
