# Dev-only: hot reload + source mounts
services:

  api:
    build:
      target: development
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8080
      --reload
      --reload-dir /app/app
    volumes:
      - ../../backend/app:/app/app
      - ../../backend/tests:/app/tests
      - ../../backend/alembic:/app/alembic
    environment:
      DEBUG: "true"
      APP_ENV: development

  worker:
    build:
      target: development
    command: python -m app.workers.runner
    volumes:
      - ../../backend/app:/app/app
    environment:
      DEBUG: "true"
      APP_ENV: development

  # DB browser at http://localhost:8888
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8888:8080"
    depends_on:
      - postgres
